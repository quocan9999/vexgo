name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API CI
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: vexgo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    env:
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/vexgo_ci
      MIGRATION_URL: mysql://root:ci-root-password@127.0.0.1:3306/vexgo_ci
      SHADOW_DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/vexgo_ci_shadow
      JWT_ACCESS_SECRET: vexgo-ci-only-jwt-secret-not-for-any-deployment-2026
      OTP_HASH_SECRET: vexgo-ci-only-otp-secret-not-for-any-deployment-2026
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.14.1

      - name: Verify Node.js and npm versions
        run: |
          node --version
          npm_version="$(npm --version)"
          printf 'npm %s\n' "$npm_version"
          test "$npm_version" = "11.14.1"

      - run: npm ci

      # This also generates Prisma Client, which is needed before tests and typecheck.
      - name: API build
        run: npm run build --workspace=@vexgo/api

      - name: Apply API database migrations
        run: npm exec -- prisma migrate deploy

      - name: Seed the auth E2E role
        run: node prisma/seed-auth-e2e.mjs

      - name: API tests
        run: npm run test --workspace=@vexgo/api

      - name: API e2e tests
        run: npm run test:e2e --workspace=@vexgo/api

      - name: API typecheck
        run: npm run typecheck --workspace=@vexgo/api

      - name: API lint
        run: npm run lint --workspace=@vexgo/api

  admin:
    name: Admin CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.14.1

      - name: Verify Node.js and npm versions
        run: |
          node --version
          npm_version="$(npm --version)"
          printf 'npm %s\n' "$npm_version"
          test "$npm_version" = "11.14.1"

      - run: npm ci

      - name: Admin tests
        run: npm run test --workspace=@vexgo/admin

      - name: Admin typecheck
        run: npm run typecheck --workspace=@vexgo/admin

      - name: Admin lint
        run: npm run lint --workspace=@vexgo/admin

      - name: Admin build
        run: npm run build --workspace=@vexgo/admin

  web:
    name: Web CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.14.1

      - name: Verify Node.js and npm versions
        run: |
          node --version
          npm_version="$(npm --version)"
          printf 'npm %s\n' "$npm_version"
          test "$npm_version" = "11.14.1"

      - run: npm ci

      - name: Web unit tests
        run: npm run test --workspace=@vexgo/web

      - name: Web typecheck
        run: npm run typecheck --workspace=@vexgo/web

      - name: Web lint
        run: npm run lint --workspace=@vexgo/web

      - name: Web build
        run: npm run build --workspace=@vexgo/web

      - name: Web e2e and route regression tests
        run: npm run test:e2e --workspace=@vexgo/web
