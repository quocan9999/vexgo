name: Backup and restore tools

on:
  pull_request:
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/backup-restore.yml'
  push:
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/backup-restore.yml'

permissions:
  contents: read

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Archive and safety regression tests
        run: node --test scripts/backup/backup.test.mjs scripts/backup/cloudinary.test.mjs
      - name: Prepare disposable MySQL image
        run: docker pull mysql:8.4
      - name: Real backup, isolated restore, mirror and retention
        run: node --test scripts/backup/docker-smoke.test.mjs
        env:
          VEXGO_BACKUP_DOCKER_TEST: '1'
      - name: Snapshot-linked encrypted media and isolated DB relinking
        run: node --test scripts/backup/cloudinary-smoke.test.mjs
        env:
          VEXGO_BACKUP_DOCKER_TEST: '1'
          # Cloud transport is mocked here. Real Cloudinary is opt-in locally.
